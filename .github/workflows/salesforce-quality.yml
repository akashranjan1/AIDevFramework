name: Salesforce quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli
      - name: Verify CLI installation
        run: sf --version
      # Add repository-specific lint/Apex/Jest commands and an authenticated
      # validate-only deployment here. Never expose production credentials to PR jobs.
